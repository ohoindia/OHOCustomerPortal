capabilities = "CAPABILITY_IAM"
parameter_overrides = "ApiStageName=\"prod\" AllowedFrontendOrigins=\"*\" ApiReservedConcurrency=\"20\" VpcSubnetIds=\"\" VpcSecurityGroupIds=\"\" OnboardingSmsQueueArn=\"\""
image_repositories = []

[prod.global.parameters]
region = "ap-south-1"

[dev.deploy.parameters]
stack_name = "oho-customer-api-dev"
resolve_s3 = true
