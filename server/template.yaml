AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: OHO customer NestJS API on Lambda and API Gateway HTTP API

Parameters:
  AllowedFrontendOrigins:
    Type: CommaDelimitedList
    Default: "http://localhost:5173"
    Description: Explicit browser origins allowed by API Gateway; match CORS_ORIGINS in the database
  ApiReservedConcurrency:
    Type: Number
    Default: 20
    MinValue: 6
    Description: Lambda concurrency; Book Service loads six endpoints in parallel
  VpcSubnetIds:
    Type: String
    Default: ""
    Description: Comma-separated private subnet IDs; leave empty for a publicly reachable database
  VpcSecurityGroupIds:
    Type: String
    Default: ""
    Description: Comma-separated Lambda security group IDs; required when subnet IDs are supplied
  OnboardingSmsQueueArn:
    Type: String
    Default: ""
    Description: Optional ARN of the queue configured in ConfigValues or ConfigSecrets

Conditions:
  UseVpc: !And
    - !Not [!Equals [!Ref VpcSubnetIds, ""]]
    - !Not [!Equals [!Ref VpcSecurityGroupIds, ""]]
  UseQueue: !Not [!Equals [!Ref OnboardingSmsQueueArn, ""]]

Rules:
  VpcParametersTogether:
    Assertions:
      - Assert: !Or
          - !And
            - !Equals [!Ref VpcSubnetIds, ""]
            - !Equals [!Ref VpcSecurityGroupIds, ""]
          - !And
            - !Not [!Equals [!Ref VpcSubnetIds, ""]]
            - !Not [!Equals [!Ref VpcSecurityGroupIds, ""]]
        AssertDescription: Supply both VPC subnet IDs and security group IDs, or leave both empty.

Resources:
  CustomerHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: "$default"
      # Handle preflight without consuming Lambda slots. Gateway responses must
      # also be readable when an integration fails before Nest can add headers.
      CorsConfiguration:
        AllowOrigins: !Ref AllowedFrontendOrigins
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [Authorization, Content-Type]
        ExposeHeaders: [Retry-After, X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset]
        MaxAge: 300
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  CustomerApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: build/lambda/
      Handler: dist/lambda.handler
      Runtime: nodejs22.x
      Architectures: [x86_64]
      MemorySize: 1024
      Timeout: 29
      ReservedConcurrentExecutions: !Ref ApiReservedConcurrency
      VpcConfig: !If
        - UseVpc
        - SubnetIds: !Split [",", !Ref VpcSubnetIds]
          SecurityGroupIds: !Split [",", !Ref VpcSecurityGroupIds]
        - !Ref AWS::NoValue
      # DB_* settings are maintained directly in Lambda Environment variables.
      # Application settings are read from ConfigValues and ConfigSecrets in MySQL.
      # Keep Environment omitted so this template does not manage those values.
      Policies:
        # SAM automatically attaches AWSLambdaBasicExecutionRole to the generated role.
        # It also attaches AWSLambdaVPCAccessExecutionRole when VpcConfig is present.
        - !If
          - UseQueue
          - Statement:
              - Effect: Allow
                Action: [sqs:SendMessage, sqs:GetQueueUrl]
                Resource: !Ref OnboardingSmsQueueArn
          - !Ref AWS::NoValue
      Events:
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref CustomerHttpApi
            Path: /{proxy+}
            Method: ANY
            PayloadFormatVersion: "2.0"

Outputs:
  ApiBaseUrl:
    Description: Base URL for VITE_API_BASE_URL
    Value: !Sub "https://${CustomerHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  FunctionName:
    Value: !Ref CustomerApiFunction
